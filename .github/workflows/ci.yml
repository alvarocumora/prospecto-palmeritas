name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - chore/stabilize-code-quality

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run typecheck

      - name: Report generated route changes
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: git diff -- src/routeTree.gen.ts

      - name: Lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run lint

      - name: Test
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test

      - name: Build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build
