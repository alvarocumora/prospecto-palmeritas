name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - chore/stabilize-code-quality

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Prepare formatting diagnostics
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          npx --no-install prettier --write src/lib/geospatial/terrainCoordinates.ts src/lib/geospatial/terrainCoordinates.test.ts src/engine3d/terrain/dem.functions.ts src/engine3d/terrain/dem.mosaic.test.ts src/features/franco/cholquiGeoPolicy.ts src/lib/geospatial/layerPreferences.ts src/hooks/useGeoLayerPreferences.ts src/lib/geospatial/leafletOpacity.ts src/lib/geospatial/layerPreferences.test.ts src/features/franco/cholquiPublicGeo.ts src/features/franco/cholquiPublicGeo.test.ts src/components/geo/ProjectMasterViewer.tsx src/features/franco/components/CholquiMasterViewer.tsx src/components/geo/PublicGeoLayerControls.tsx src/features/franco/components/CholquiTerrain3D.tsx src/hooks/useGeoLayerPreferences.test.tsx src/components/geo/PublicGeoLayerControls.test.tsx docs/cholqui-geoscience-visualization-v1.md
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const path of ["src/lib/geospatial/terrainCoordinates.ts","src/lib/geospatial/terrainCoordinates.test.ts","src/engine3d/terrain/dem.functions.ts","src/engine3d/terrain/dem.mosaic.test.ts","src/features/franco/cholquiGeoPolicy.ts","src/lib/geospatial/layerPreferences.ts","src/hooks/useGeoLayerPreferences.ts","src/lib/geospatial/leafletOpacity.ts","src/lib/geospatial/layerPreferences.test.ts","src/features/franco/cholquiPublicGeo.ts","src/features/franco/cholquiPublicGeo.test.ts","src/components/geo/ProjectMasterViewer.tsx","src/features/franco/components/CholquiMasterViewer.tsx","src/components/geo/PublicGeoLayerControls.tsx","src/features/franco/components/CholquiTerrain3D.tsx","src/hooks/useGeoLayerPreferences.test.tsx","src/components/geo/PublicGeoLayerControls.test.tsx","docs/cholqui-geoscience-visualization-v1.md"]) {
            console.log('FORMAT_FILE ' + JSON.stringify({ path, base64: readFileSync(path).toString('base64') }));
          }
          NODE

      - name: Typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run typecheck

      - name: Report generated route changes
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: git diff -- src/routeTree.gen.ts

      - name: Lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run lint

      - name: Test
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test

      - name: Build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build
