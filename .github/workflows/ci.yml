name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - chore/stabilize-code-quality

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build
