name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - chore/stabilize-code-quality

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Prepare formatting diagnostics
        run: |
          npx --no-install prettier --write src/lib/pdf/adapters/cholquiGeoscience.ts src/lib/pdf/adapters/cholqui.ts src/lib/pdf/adapters/cholquiTargets.ts src/lib/pdf/adapters/cholquiFieldMemo.ts src/features/franco/components/CholquiTargetsSummary.tsx src/lib/pdf/adapters/cholquiInvestment.ts src/features/franco/cholquiPdf.ts src/lib/pdf/templates/technicalBrief.ts src/lib/cholqui/geophysicsTerrain.ts src/components/map/geophysicsLayers.ts src/lib/geoscience/geophysicsSurface.ts src/features/franco/components/CholquiMasterViewer.tsx src/features/franco/components/CholquiGeophysicsTerrainLayer.tsx src/features/franco/components/CholquiTerrain3D.tsx src/lib/cholqui/geophysicsTerrain.test.ts src/lib/geoscience/geophysicsSurface.test.ts src/lib/pdf/adapters/cholquiReports.test.ts docs/cholqui-geoscience-data-and-reports-v2.md
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const path of ["src/lib/pdf/adapters/cholquiGeoscience.ts","src/lib/pdf/adapters/cholqui.ts","src/lib/pdf/adapters/cholquiTargets.ts","src/lib/pdf/adapters/cholquiFieldMemo.ts","src/features/franco/components/CholquiTargetsSummary.tsx","src/lib/pdf/adapters/cholquiInvestment.ts","src/features/franco/cholquiPdf.ts","src/lib/pdf/templates/technicalBrief.ts","src/lib/cholqui/geophysicsTerrain.ts","src/components/map/geophysicsLayers.ts","src/lib/geoscience/geophysicsSurface.ts","src/features/franco/components/CholquiMasterViewer.tsx","src/features/franco/components/CholquiGeophysicsTerrainLayer.tsx","src/features/franco/components/CholquiTerrain3D.tsx","src/lib/cholqui/geophysicsTerrain.test.ts","src/lib/geoscience/geophysicsSurface.test.ts","src/lib/pdf/adapters/cholquiReports.test.ts","docs/cholqui-geoscience-data-and-reports-v2.md"]) {
            console.log('FORMAT_FILE ' + JSON.stringify({path, base64: readFileSync(path).toString('base64')}));
          }
          NODE
      - name: Typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run typecheck

      - name: Report generated route changes
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: git diff -- src/routeTree.gen.ts

      - name: Lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run lint

      - name: Test
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test

      - name: Build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build
