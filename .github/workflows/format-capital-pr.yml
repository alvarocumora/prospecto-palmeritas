name: Format Capital PR (temporary)
on:
  push:
    branches:
      - feat/global-ui-capital-portfolio-collateral
    paths:
      - .github/workflows/format-capital-pr.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-ui-capital-portfolio-collateral
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier rules only to Capital files
        run: npx prettier --write src/routes/_authenticated.dashboard.investments.tsx src/routes/_authenticated.dashboard.inversion-colateral.tsx src/features/investor/InvestorWallet.tsx
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated.dashboard.investments.tsx src/routes/_authenticated.dashboard.inversion-colateral.tsx src/features/investor/InvestorWallet.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(capital): apply repository Prettier formatting"
            git push origin HEAD:feat/global-ui-capital-portfolio-collateral
          fi
