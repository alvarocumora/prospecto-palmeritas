name: One-shot format GEO-VIEW

on:
  push:
    branches:
      - feat/geoview-snapshot-manifest

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/geoview-snapshot-manifest
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply safe ESLint/Prettier autofixes
        run: npx eslint . --fix
      - name: Verify lint after autofix
        run: npm run lint
      - name: Commit formatting baseline and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-format-geoview.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: normalize lint baseline for geo snapshot PR"
          git push origin HEAD:feat/geoview-snapshot-manifest
