name: Tilama límites comunales

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/tilama_comunas.py'
      - '.github/workflows/tilama-comunas.yml'

permissions:
  contents: write

jobs:
  comunas:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/tilama_comunas.py
      - name: Publicar en rama de datos
        run: |
          cd out/tilama_comunas
          git init -q -b data/tilama-comunas
          git config user.name "tilama-bot"
          git config user.email "tilama-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Comunas Tilama ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" data/tilama-comunas
