name: Stabilization validation
on:
  push:
    branches: [chore/codebase-stabilization]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/codebase-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate TanStack route tree
        run: |
          npm run build
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routeTree.gen.ts
            git commit -m "chore: regenerate TanStack route tree"
            git push origin HEAD:chore/codebase-stabilization
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
