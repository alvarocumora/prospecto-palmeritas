name: Regenerate route tree

on:
  push:
    branches:
      - chore/lint-semantic-cleanup
    paths:
      - .github/workflows/regenerate-route-tree.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/lint-semantic-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate TanStack route tree
        run: timeout 30s npm run build || true
      - name: Commit generated route tree
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "routeTree.gen.ts already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "chore: regenerate TanStack route tree"
          git pull --rebase origin chore/lint-semantic-cleanup
          git push
