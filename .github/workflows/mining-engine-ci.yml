name: Mining engine Python CI

on:
  pull_request:
    paths:
      - 'services/mining-engine/**'
      - '.github/workflows/mining-engine-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/mining-engine/**'
      - '.github/workflows/mining-engine-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/mining-engine/requirements-dev.txt
      - name: Install dependencies
        working-directory: services/mining-engine
        run: pip install -r requirements-dev.txt
      - name: Python unit and API tests
        working-directory: services/mining-engine
        run: python -m pytest -q tests
      - name: Compile Python modules
        working-directory: services/mining-engine
        run: python -m compileall -q app
