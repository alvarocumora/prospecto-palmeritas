name: Customer journeys · Chromium

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/features/marketing/**'
      - 'src/features/terminal/**'
      - 'src/components/shell/AppShell.tsx'
      - 'src/routes/auth.tsx'
      - 'src/routes/catastro.index.tsx'
      - 'src/routes/_authenticated.dashboard.investments.tsx'
      - 'public/manifest.webmanifest'
      - 'scripts/qa/customerJourneysChromium.mjs'
      - '.github/workflows/customer-journeys-chromium.yml'

permissions:
  contents: read

# A PR can receive frequent UX changes: keep only its latest Chromium run.
concurrency:
  group: chromium-clients-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Chromium 390px + 1440px
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install disposable Playwright for CI (no lockfile changes)
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify formatting of client journey files
        run: npx prettier --check scripts/qa/customerJourneysChromium.mjs src/features/marketing/HeroGeospatial.tsx src/routes/auth.tsx
      - name: Start GeoCapitals server locally
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/geocapitals-browser-server.log 2>&1 &
          echo $! > /tmp/geocapitals-browser-server.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/geocapitals-browser-server.log
          exit 1
      - name: Chromium · public customer journeys
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_OUTPUT: artifacts/chromium-customer-journeys
        run: node scripts/qa/customerJourneysChromium.mjs
      - name: Save screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-customer-journeys-${{ github.run_id }}
          path: |
            artifacts/chromium-customer-journeys/
            /tmp/geocapitals-browser-server.log
          retention-days: 14
          if-no-files-found: warn
