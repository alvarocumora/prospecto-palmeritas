name: Tilama catastro SERNAGEOMIN

# Refresca el catastro del KMZ de Tilama desde el FeatureServer Marcelo_Layer
# (catastro SNGM v2) y anota la tenencia de zonas y muestras.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * 1' # lunes 08:17 Chile (UTC-3)
  pull_request:
    paths:
      - 'scripts/tilama_catastro_kmz.py'
      - '.github/workflows/tilama-catastro.yml'

permissions:
  contents: write

concurrency:
  group: tilama-catastro-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install shapely
      - name: Diagnostico - servicios que usa el visor oficial SNGM
        continue-on-error: true
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) Chrome/130 Safari/537.36'
          base=https://appsngmaz.sernageomin.cl
          curl -sSL -A "$UA" "$base/catastro_SNGM/home/index" -o visor.html || true
          echo "HTML: $(wc -c < visor.html) bytes"
          grep -oE '(src|href)="[^"]+\.js[^"]*"' visor.html | sed -E 's/^(src|href)="//;s/"$//' | sort -u > js.txt
          cat js.txt
          : > urls.txt
          grep -oE 'https?://[^"'"'"' )]*(arcgis|FeatureServer|MapServer|services)[^"'"'"' )]*' visor.html >> urls.txt || true
          while read -r js; do
            case "$js" in http*) u="$js";; /*) u="$base$js";; *) u="$base/catastro_SNGM/$js";; esac
            curl -sSL -A "$UA" "$u" | grep -oE 'https?://[^"'"'"' )]*(arcgis|FeatureServer|MapServer|/rest/services)[^"'"'"' )]*' >> urls.txt || true
          done < js.txt
          echo "== URLs de servicios en el visor =="; sort -u urls.txt
      - name: Consultar catastro y regenerar KMZ
        run: python scripts/tilama_catastro_kmz.py
      - name: Guardar cambios
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain docs/tilama)" ]; then
            echo "Sin cambios en el catastro"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/tilama/tilama_prioridades_estructuras.kmz docs/tilama/catastro_vivo_resumen.md
          git commit -m "Actualizar catastro SERNAGEOMIN de Tilama ($(date +%d-%m-%Y))"
          git push
