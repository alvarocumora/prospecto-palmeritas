name: Tilama catastro SERNAGEOMIN

# Refresca el catastro del KMZ de Tilama desde el FeatureServer que usa el
# visor oficial SNGM (arcgisawa.sernageomin.cl/.../VIEW_WGS84/FeatureServer/2) y anota la tenencia de zonas y muestras.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * 1' # lunes 08:17 Chile (UTC-3)
  pull_request:
    paths:
      - 'scripts/tilama_catastro_kmz.py'
      - '.github/workflows/tilama-catastro.yml'

permissions:
  contents: write

concurrency:
  group: tilama-catastro-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install shapely
      - name: Consultar catastro y regenerar KMZ
        run: python scripts/tilama_catastro_kmz.py
      - name: Subir KMZ y resumen como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tilama-catastro
          path: |
            docs/tilama/tilama_prioridades_estructuras.kmz
            docs/tilama/catastro_vivo_resumen.md
      # En un PR solo se valida y se deja el artefacto: un commit hecho con
      # GITHUB_TOKEN no dispara el CI y dejaria el PR sin checks en su head.
      - name: Guardar cambios
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain docs/tilama)" ]; then
            echo "Sin cambios en el catastro"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/tilama/tilama_prioridades_estructuras.kmz docs/tilama/catastro_vivo_resumen.md
          git commit -m "Actualizar catastro SERNAGEOMIN de Tilama ($(date +%d-%m-%Y))"
          git push
