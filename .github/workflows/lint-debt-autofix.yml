name: Lint debt autofix

on:
  push:
    branches:
      - chore/lint-debt-autofix

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/lint-debt-autofix
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format

      - name: ESLint safe autofix
        run: npx eslint . --fix || true

      - name: Commit mechanical fixes
        run: |
          if git diff --quiet; then
            echo "No autofix changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply repository-wide formatter and eslint autofix"
          git push origin HEAD:chore/lint-debt-autofix
