# Suite Python de datos (B1 datum + B2 ETL). Corre en CI y falla el build si un
# test no pasa (p.ej. un punto de control fuera de tolerancia, o el versionado
# del ETL se rompe). Independiente del ci.yml (Node) que mantiene Lovable.
name: Datos (B1/B2)

on:
  pull_request:
    paths:
      - "tests/**"
      - "etl/**"
      - "src/lib/tenencia/control-points.json"
      - "supabase/migrations/**"
      - ".github/workflows/datum.yml"
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "etl/**"
      - "src/lib/tenencia/control-points.json"

jobs:
  datos:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geocap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/geocap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: pip install -r tests/requirements.txt
      - name: Run suite (datum + etl + franco)
        run: pytest -v tests/
