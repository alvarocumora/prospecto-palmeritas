name: Temporary format PR 343 files
on:
  push:
    branches: [feat/global-ux-landing-terminal-navigation]
    paths: [.github/workflows/format-ux-pr343-temporary.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-ux-landing-terminal-navigation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format PR 343 lint fixes
        run: npx prettier --write scripts/qa/customerJourneysChromium.mjs src/features/marketing/HeroGeospatial.tsx src/routes/auth.tsx
      - name: Commit only formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/qa/customerJourneysChromium.mjs src/features/marketing/HeroGeospatial.tsx src/routes/auth.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(ux): format Chromium QA and client journey UI"
            git push origin HEAD:feat/global-ux-landing-terminal-navigation
          fi
